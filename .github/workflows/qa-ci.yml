# Runs the Quantitative Signal Discovery Agent CLI test suite from the shared QA
# image. This blueprint is pure Python (uv + nvidia-nat) and calls hosted NVIDIA
# inference (build.nvidia.com), so no local GPU is required.
#
# Design goals: full coverage, strict assertions, stable in CI.
#   * Full   - runs every CLI scenario the blueprint documents (momentum /
#              volatility / mean-reversion / volume-price divergence).
#   * Strict - pytest runs without swallowing its exit code; each case asserts on
#              the "Workflow Result:" payload (status/iteration/saved_path present
#              and non-empty, mean_ic numeric) via the YAML test spec, so a
#              broken/empty result fails the job.
#   * Stable - uses the no-telemetry config (no flaky Phoenix/OTLP exporter),
#              tolerates only nat's unreliable process exit code (handled per-case
#              by skip_exit_code_check in the YAML, not by masking pytest),
#              retries transient LLM/network hiccups, and does all setup + test in
#              a single container environment (no cross-env venv drift).
#
# Required repository secrets:
#   NVIDIA_API_KEY         build.nvidia.com API key (nvapi-...) used by nat to
#                          call hosted inference.
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to
#                          nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image.
#                          If unset, the test step is skipped.
#
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM
#
# Note: the QA image ':latest' is built from 'main', so the
# quantitative_signal_discovery_agent tests + their conftest options
# (--nat-binary, --qsd-config-optimization) must be merged to main first.

name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quantitative-signal-discovery-cli:
    name: Quantitative Signal Discovery Agent CLI
    # No GPU needed (hosted inference). Swap to an org runner if registry /
    # network access to nvcr.io requires a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      QA_TEST_IMAGE: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest
      # No-telemetry config: no Phoenix/OTLP exporter, so no localhost:6006
      # connection-refused retries that slow the run and make nat exit non-zero.
      QSD_CONFIG: configs/config-optimization-no-telemetry.yml
    steps:
      - uses: actions/checkout@v4

      - name: Run Quantitative Signal Discovery CLI tests
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          : "${NVIDIA_API_KEY:?NVIDIA_API_KEY secret missing}"
          [ -n "${TEST_DOCKER_PULL_KEY:-}" ] || { echo "TEST_DOCKER_PULL_KEY unset; skipping."; exit 0; }
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"

          # Everything runs inside the QA image so nat + its deps live in the same
          # environment the test subprocess uses. The blueprint checkout is mounted
          # at /blueprint; the QA test harness lives at /app inside the image.
          docker run --rm \
            -e NVIDIA_API_KEY \
            -e QSD_CONFIG \
            -v "$(pwd):/blueprint" \
            "${QA_TEST_IMAGE}" bash -lc '
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"

              cd /blueprint
              uv sync --locked
              # Download the S&P 500 price/volume dataset the workflow analyses.
              uv run python -m signal_discovery_workflow.download_data

              # Run from /blueprint so nat resolves the dataset, but point pytest at
              # the /app test tree so it loads the harness conftest + options.
              pytest /app/testcases/quantitative_signal_discovery_agent \
                -m "quantitative_signal_discovery_agent and cli" \
                --nat-binary=/blueprint/.venv/bin/nat \
                --qsd-config-optimization="/blueprint/${QSD_CONFIG}" \
                --reruns=2 --reruns-delay=30 \
                --disable-warnings -v --timeout=900 \
                --html=/blueprint/qsd-cli-test.html --self-contained-html
            '

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          # Any nat result JSONs the workflow saved during the run.
          cp -r src/signal_discovery_workflow/output ci-diagnostics/nat-output 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantitative-signal-discovery-cli-test
          path: |
            qsd-cli-test.html
            ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}${SMTP_PASSWORD:-}${SMTP_MAIL_TO:-}${SMTP_MAIL_FROM:-}" ] \
            && [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
