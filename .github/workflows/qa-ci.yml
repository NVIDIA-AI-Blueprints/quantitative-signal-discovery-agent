name: Quantitative Signal Discovery Agent QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: "blueprint-github-test image that runs the QA cases"
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHON_VERSION: "3.12"
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      NOTEBOOK_HTML: notebooks/signal-discovery-workflow.html
      NOTEBOOK_EXECUTED: notebooks/signal-discovery-workflow.executed.ipynb
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${NVIDIA_API_KEY}" ]; then echo "::error::secret NVIDIA_API_KEY is not set"; missing=1; fi
          if [ -z "${TEST_DOCKER_PULL_KEY}" ]; then echo "::error::secret TEST_DOCKER_PULL_KEY is not set"; missing=1; fi
          exit "${missing}"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Set up Python
        run: uv python install "${PYTHON_VERSION}"

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Download S&P 500 data
        run: |
          set -euo pipefail
          uv run --locked python -m signal_discovery_workflow.download_data
          ls src/signal_discovery_workflow/data/sp500/*.csv

      - name: Execute notebook
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          uv run --locked jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output signal-discovery-workflow.executed.ipynb \
            notebooks/signal-discovery-workflow.ipynb
          uv run --locked jupyter nbconvert --to html \
            --output signal-discovery-workflow.html \
            "${NOTEBOOK_EXECUTED}"
          test -s "${NOTEBOOK_HTML}"

      - name: Run QA tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          UV_PYTHON_DIR="$(uv python dir)"
          docker run --rm \
            -e NVIDIA_API_KEY \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${UV_PYTHON_DIR}:${UV_PYTHON_DIR}:ro" \
            -v "${GITHUB_WORKSPACE}/${NOTEBOOK_HTML}:/app/input/quantitative_signal_discovery_agent/signal-discovery-workflow.html:ro" \
            "${TEST_IMAGE}" \
            pytest -m quantitative_signal_discovery_agent \
              --nat-binary="${GITHUB_WORKSPACE}/.venv/bin/nat" \
              --qsd-config-optimization="${GITHUB_WORKSPACE}/configs/config-optimization-no-telemetry.yml" \
              --timeout=900 \
              -rs \
              --disable-warnings \
              --html="${GITHUB_WORKSPACE}/qsd-test.html" --self-contained-html
          test -s qsd-test.html

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: qa-results
          path: |
            notebooks/signal-discovery-workflow.html
            notebooks/signal-discovery-workflow.executed.ipynb
            qsd-test.html
            src/signal_discovery_workflow/output/*.json
          retention-days: 30

      - name: Set result output
        id: set_result
        if: always()
        run: |
          echo "RESULT=$(if [ ${{ job.status }} == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> "$GITHUB_OUTPUT"

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>

            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>

            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>

            <p>Thanks!</p>
