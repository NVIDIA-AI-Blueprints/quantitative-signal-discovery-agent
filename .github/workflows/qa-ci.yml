# Runs the Quantitative Signal Discovery Agent QA suite (CLI + notebook) from the
# shared QA image. This blueprint is pure Python (uv + nvidia-nat) and calls
# hosted NVIDIA inference (build.nvidia.com); it has NO deployable server /
# docker-compose stack, so its "deployment" is simply `uv sync` + dataset download.
#
# CLI and notebook run in a SINGLE container / SINGLE pytest session so the heavy
# setup happens once (one image pull, one `uv sync`, one dataset download, one
# editable install) instead of being duplicated per suite:
#   1. CLI tests      - `nat run` for the four documented factor prompts, asserting
#                       on each "Workflow Result:" payload.
#   2. Notebook test  - execute the SHIPPED notebook
#                       (notebooks/signal-discovery-workflow.ipynb) end-to-end with
#                       nbconvert, export HTML, and assert on the executed cells.
#                       This exercises the real notebook instead of a stale fixture.
#                       The generated HTML is dropped into /app/input where the
#                       harness notebook test expects it (the QA image ships no
#                       input/ fixtures - the Dockerfile strips them).
#
# Required repository secrets:
#   NVIDIA_API_KEY         build.nvidia.com API key (nvapi-...) used by nat.
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to the QA image.
#                          If unset, the job is skipped.
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM
#
# Note: the QA image ':latest' is built from 'main', so the
# quantitative_signal_discovery_agent tests + conftest options must be on main.

name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quantitative-signal-discovery:
    name: Quantitative Signal Discovery Agent
    # No GPU needed (hosted inference). Swap to an org runner if registry /
    # network access to nvcr.io requires a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      QA_TEST_IMAGE: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest
      # No-telemetry config: no Phoenix/OTLP exporter, so no localhost:6006
      # connection-refused retries that slow the run and make nat exit non-zero.
      QSD_CONFIG: configs/config-optimization-no-telemetry.yml
    steps:
      - uses: actions/checkout@v4

      - name: Run Quantitative Signal Discovery tests (CLI + notebook)
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          : "${NVIDIA_API_KEY:?NVIDIA_API_KEY secret missing}"
          [ -n "${TEST_DOCKER_PULL_KEY:-}" ] || { echo "TEST_DOCKER_PULL_KEY unset; skipping."; exit 0; }
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"

          # One container for both suites. The blueprint checkout is mounted at
          # /blueprint; the QA harness lives at /app inside the image. nat + its
          # deps live in the same environment the tests use.
          # Script is piped into the container via a quoted heredoc (bash -s), so
          # any quoting/apostrophes inside it are worry-free. $HOME/$PATH and
          # ${QSD_CONFIG}/$NVIDIA_API_KEY stay literal here and expand inside the
          # container; $(pwd) is expanded by the runner for the bind mount.
          docker run --rm -i \
            -e NVIDIA_API_KEY \
            -e QSD_CONFIG \
            -v "$(pwd):/blueprint" \
            "${QA_TEST_IMAGE}" bash -s <<'DOCKER_SCRIPT'
          set -euo pipefail

          # /blueprint is owned by the runner user but the container runs as root;
          # allow git introspection during the editable build.
          git config --global --add safe.directory /blueprint

          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          cd /blueprint
          # --extra test pulls the notebook toolchain the notebook itself uses; add
          # nbconvert/ipykernel defensively in case they aren't in the lock.
          uv sync --locked --extra test
          uv pip install --quiet nbconvert nbclient ipykernel
          uv run python -m ipykernel install --user --name python3 --display-name python3

          # Download the S&P 500 dataset once (nat loads it via the editable package,
          # so it resolves regardless of the test process cwd).
          uv run python -m signal_discovery_workflow.download_data

          # Execute the shipped notebook end-to-end and export HTML. --allow-errors
          # keeps optional cells (e.g. the Phoenix UI helper) from aborting the run;
          # the run cell still prints its "Workflow Result:" payload even if telemetry
          # export fails, and the pytest assertion gates that result. The trailing
          # "|| true" means a notebook hiccup doesn't block the CLI suite - the
          # notebook cases fail clearly if the HTML is missing. The notebook self-syncs
          # and chdirs to the repo root, so relative configs/ and src/ paths resolve.
          uv run python -m nbconvert --to html --execute --allow-errors \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output signal-discovery-workflow.html \
            --output-dir /blueprint \
            notebooks/signal-discovery-workflow.ipynb || true

          # Drop the exported HTML where the harness notebook test expects it
          # (WORKSPACE/input/...); WORKSPACE resolves to cwd = /app below.
          mkdir -p /app/input/quantitative_signal_discovery_agent
          cp /blueprint/signal-discovery-workflow.html \
             /app/input/quantitative_signal_discovery_agent/signal-discovery-workflow.html || true

          # Single pytest session for BOTH suites. Run from /app (harness root) so the
          # conftest marker grep over testcases/ + data/ works. nat + config are
          # absolute paths, so they work from any cwd.
          cd /app
          pytest testcases/quantitative_signal_discovery_agent \
            -m "quantitative_signal_discovery_agent and (cli or notebook)" \
            --nat-binary=/blueprint/.venv/bin/nat \
            --qsd-config-optimization="/blueprint/${QSD_CONFIG}" \
            --reruns=1 --reruns-delay=20 \
            --disable-warnings -v --timeout=900 \
            --html=/blueprint/qsd-test.html --self-contained-html
          DOCKER_SCRIPT

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          cp -r src/signal_discovery_workflow/output ci-diagnostics/nat-output 2>/dev/null || true
          cp signal-discovery-workflow.html ci-diagnostics/ 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantitative-signal-discovery-test
          path: |
            qsd-test.html
            signal-discovery-workflow.html
            ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}${SMTP_PASSWORD:-}${SMTP_MAIL_TO:-}${SMTP_MAIL_FROM:-}" ] \
            && [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
