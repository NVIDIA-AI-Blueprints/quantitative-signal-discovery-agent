name: Quantitative Signal Discovery Agent QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image
        type: string
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run ruff check
        run: uvx ruff check src tests

      - name: Run tests
        run: uv run --locked pytest tests/ -v --tb=short

  run-notebooks:
    needs: [test]
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Check System Info
        run: |
          echo "===================== System Info ====================="
          more /etc/os-release
          uname -a
          docker version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Execute notebook
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          uv run --locked jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=3600 \
            --output signal-discovery-workflow-result.ipynb \
            notebooks/signal-discovery-workflow.ipynb
          uv run --locked jupyter nbconvert --to html \
            --output signal-discovery-workflow.html \
            notebooks/signal-discovery-workflow-result.ipynb
          test -s notebooks/signal-discovery-workflow.html

      - name: Verify results
        if: success()
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          cd notebooks
          echo "$TEST_DOCKER_PULL_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker run --rm \
            -v ./signal-discovery-workflow.html:/app/input/quantitative_signal_discovery_agent/signal-discovery-workflow.html \
            -v "$(pwd):/workspace" \
            "$TEST_IMAGE" \
            pytest -m "quantitative_signal_discovery_agent and notebook" --disable-warnings --html=/workspace/quantitative_signal_discovery_agent.html --self-contained-html

      - name: Upload notebook results as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: notebook-results
          path: |
            notebooks/signal-discovery-workflow.html
            notebooks/signal-discovery-workflow-result.ipynb
            notebooks/quantitative_signal_discovery_agent.html
          retention-days: 30

      - name: Set result output
        id: set_result
        if: always()
        run: |
          echo "RESULT=$(if [ ${{ job.status }} == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> $GITHUB_OUTPUT

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>

            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>

            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>

            <p>Thanks!</p>
