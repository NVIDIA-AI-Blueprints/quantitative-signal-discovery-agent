# Full QA for the Quantitative Signal Discovery Agent blueprint, run from the
# shared QA image. This blueprint is pure Python (uv + nvidia-nat) and calls
# hosted NVIDIA inference (build.nvidia.com); it has NO deployable server /
# docker-compose stack, so its "deployment" is simply `uv sync` + dataset
# download. The job therefore has three phases:
#
#   1. Set up (deploy-equivalent) - uv sync + download the S&P 500 dataset.
#   2. CLI tests   - run every documented `nat run` scenario (momentum /
#                    volatility / mean-reversion / volume-price divergence) and
#                    assert on the "Workflow Result:" payload.
#   3. Notebook tests - validate the committed exported-notebook HTML fixture
#                    (input/.../factor-mining-workflow.html) for the same
#                    scenarios. Static fixture, no inference needed.
#
# Strict + stable:
#   * pytest runs without masking its exit code; the job fails if any case fails.
#   * Content is asserted (status/iteration/saved_path non-empty, mean_ic numeric)
#     via the YAML specs, so a broken/empty result fails.
#   * Uses the no-telemetry config (no flaky Phoenix/OTLP exporter). Only nat's
#     unreliable process exit code is tolerated, per-case via skip_exit_code_check
#     in the YAML - never at the pytest level.
#   * Transient LLM/network hiccups are retried; all setup + tests share one
#     container environment (no cross-env venv drift).
#
# Required repository secrets:
#   NVIDIA_API_KEY         build.nvidia.com API key (nvapi-...) used by nat.
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to the QA image.
#                          If unset, the job is skipped.
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM
#
# Note: the QA image ':latest' is built from 'main', so the
# quantitative_signal_discovery_agent tests + conftest options must be on main.

name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quantitative-signal-discovery:
    name: Quantitative Signal Discovery Agent QA
    # No GPU needed (hosted inference). Swap to an org runner if registry /
    # network access to nvcr.io requires a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      QA_TEST_IMAGE: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest
      # No-telemetry config: no Phoenix/OTLP exporter, so no localhost:6006
      # connection-refused retries that slow the run and make nat exit non-zero.
      QSD_CONFIG: configs/config-optimization-no-telemetry.yml
    steps:
      - uses: actions/checkout@v4

      - name: Run QA (setup + CLI + notebook)
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          : "${NVIDIA_API_KEY:?NVIDIA_API_KEY secret missing}"
          [ -n "${TEST_DOCKER_PULL_KEY:-}" ] || { echo "TEST_DOCKER_PULL_KEY unset; skipping."; exit 0; }
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"

          # Everything runs inside the QA image: the blueprint checkout is mounted
          # at /blueprint (so nat + its deps install into a container-native venv),
          # while the QA test harness + committed fixtures live at /app.
          docker run --rm \
            -e NVIDIA_API_KEY \
            -e QSD_CONFIG \
            -v "$(pwd):/blueprint" \
            "${QA_TEST_IMAGE}" bash -lc '
              set -uo pipefail

              # ---- Phase 1: set up (deploy-equivalent) ----------------------
              echo "::group::Set up blueprint (uv sync + dataset)"
              # /blueprint is owned by the runner user but the container runs as
              # root; allow git introspection during the editable build.
              git config --global --add safe.directory /blueprint
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              cd /blueprint
              uv sync --locked
              uv run python -m signal_discovery_workflow.download_data
              echo "::endgroup::"

              rc=0

              # ---- Phase 2: CLI tests (live nat runs) ----------------------
              echo "::group::CLI tests"
              # cwd=/blueprint so nat resolves the dataset; point pytest at the
              # /app test tree so it loads the harness conftest + options.
              cd /blueprint
              pytest /app/testcases/quantitative_signal_discovery_agent \
                -m "quantitative_signal_discovery_agent and cli" \
                --nat-binary=/blueprint/.venv/bin/nat \
                --qsd-config-optimization="/blueprint/${QSD_CONFIG}" \
                --reruns=2 --reruns-delay=30 \
                --disable-warnings -v --timeout=900 \
                --html=/blueprint/qsd-cli-test.html --self-contained-html || rc=1
              echo "::endgroup::"

              # ---- Phase 3: notebook tests (committed HTML fixture) --------
              echo "::group::Notebook tests"
              # cwd=/app so WORKSPACE_PATH resolves the committed fixture at
              # /app/input/quantitative_signal_discovery_agent/*.html (static; no
              # inference).
              cd /app
              pytest /app/testcases/quantitative_signal_discovery_agent \
                -m "quantitative_signal_discovery_agent and notebook" \
                --disable-warnings -v --timeout=120 \
                --html=/blueprint/qsd-notebook-test.html --self-contained-html || rc=1
              echo "::endgroup::"

              exit $rc
            '

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          cp -r src/signal_discovery_workflow/output ci-diagnostics/nat-output 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantitative-signal-discovery-test
          path: |
            qsd-cli-test.html
            qsd-notebook-test.html
            ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}${SMTP_PASSWORD:-}${SMTP_MAIL_TO:-}${SMTP_MAIL_FROM:-}" ] \
            && [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
