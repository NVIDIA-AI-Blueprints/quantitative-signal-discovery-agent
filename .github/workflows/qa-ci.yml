name: Quantitative Signal Discovery Agent QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: "blueprint-github-test image that runs the QA cases"
        required: false
        default: "nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Check required secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          missing=0
          if [ -z "$NVIDIA_API_KEY" ]; then echo "::error::secret NVIDIA_API_KEY is not set"; missing=1; fi
          if [ -z "$TEST_DOCKER_PULL_KEY" ]; then echo "::error::secret TEST_DOCKER_PULL_KEY is not set"; missing=1; fi
          exit "$missing"

      - name: Install dependencies
        run: |
          uv sync --locked --extra test
          readlink -f .venv/bin/python
          uv run python --version

      - name: Download S&P 500 data
        run: |
          uv run python -m signal_discovery_workflow.download_data
          ls src/signal_discovery_workflow/data/sp500/
          test -n "$(ls src/signal_discovery_workflow/data/sp500/*.csv)"

      - name: Start Phoenix
        run: |
          nohup uv run phoenix serve > phoenix.log 2>&1 &
          echo $! > phoenix.pid
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:6006 > /dev/null; then echo "Phoenix is up"; exit 0; fi
            sleep 2
          done
          cat phoenix.log
          echo "::error::Phoenix did not start on localhost:6006"
          exit 1

      - name: Register Jupyter kernel
        run: uv run python -m ipykernel install --user --name quant-factor-mining --display-name "Quant Factor Mining"

      - name: Execute notebook
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PHOENIX_SHIM_DIR: ${{ runner.temp }}/phoenix-shim
        run: |
          set -euo pipefail
          curl -sf http://localhost:6006 > /dev/null
          mkdir -p "$PHOENIX_SHIM_DIR"
          printf '#!/bin/sh\necho "phoenix: the Start Phoenix step already serves http://localhost:6006"\n' > "$PHOENIX_SHIM_DIR/phoenix"
          chmod +x "$PHOENIX_SHIM_DIR/phoenix"
          uv run bash -c 'PATH="$PHOENIX_SHIM_DIR:$PATH"; test "$(command -v phoenix)" = "$PHOENIX_SHIM_DIR/phoenix"; exec jupyter nbconvert --to html --execute --ExecutePreprocessor.timeout=1800 notebooks/signal-discovery-workflow.ipynb --output signal-discovery-workflow.html'
          test -s notebooks/signal-discovery-workflow.html

      - name: Run QA tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "$TEST_DOCKER_PULL_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker run --rm \
            -v "$GITHUB_WORKSPACE/notebooks/signal-discovery-workflow.html:/app/input/quantitative_signal_discovery_agent/signal-discovery-workflow.html" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e NVIDIA_API_KEY \
            "$TEST_IMAGE" \
            pytest -m quantitative_signal_discovery_agent --disable-warnings \
              --nat-binary="$GITHUB_WORKSPACE/.venv/bin/nat" \
              --qsd-config-optimization="$GITHUB_WORKSPACE/configs/config-optimization-no-telemetry.yml" \
              --html=/workspace/quantitative_signal_discovery_agent.html --self-contained-html
          test -s quantitative_signal_discovery_agent.html

      - name: Stop Phoenix
        if: always()
        run: |
          if [ -f phoenix.pid ]; then kill "$(cat phoenix.pid)" 2>/dev/null || true; fi
          pkill -f "phoenix serve" || true

      - name: Upload results as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: qa-results
          path: |
            notebooks/signal-discovery-workflow.html
            quantitative_signal_discovery_agent.html
            src/signal_discovery_workflow/output/
            phoenix.log
          retention-days: 30

      - name: Set result output
        id: set_result
        if: always()
        run: |
          echo "RESULT=$(if [ ${{ job.status }} == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> $GITHUB_OUTPUT

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>

            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>

            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>

            <p>Thanks!</p>
