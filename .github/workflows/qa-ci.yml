name: Quantitative Signal Discovery Agent QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: "blueprint-github-test image that runs the QA cases"
        required: false
        default: "nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required secrets
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          missing=0
          if [ -z "$NVIDIA_API_KEY" ]; then echo "::error::secret NVIDIA_API_KEY is not set"; missing=1; fi
          if [ -z "$TEST_DOCKER_PULL_KEY" ]; then echo "::error::secret TEST_DOCKER_PULL_KEY is not set"; missing=1; fi
          exit "$missing"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --extra test

      - name: Download S&P 500 data
        run: |
          set -euo pipefail
          uv run --locked python -m signal_discovery_workflow.download_data
          ls src/signal_discovery_workflow/data/sp500/*.csv

      - name: Execute the notebook headless
        run: |
          set -euo pipefail
          uv run --locked jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1800 \
            --output signal-discovery-workflow-executed.ipynb \
            notebooks/signal-discovery-workflow.ipynb
          uv run --locked jupyter nbconvert --to html \
            --output signal-discovery-workflow \
            notebooks/signal-discovery-workflow-executed.ipynb
          test -s notebooks/signal-discovery-workflow.html

      - name: Log in to nvcr.io
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: echo "$TEST_DOCKER_PULL_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin

      - name: Run the QA suite
        run: |
          set -euo pipefail
          UV_PYTHON_DIR="$(uv python dir)"
          docker pull "$TEST_IMAGE"
          docker run --rm \
            -e NVIDIA_API_KEY \
            -v "$GITHUB_WORKSPACE/notebooks/signal-discovery-workflow.html:/app/input/quantitative_signal_discovery_agent/signal-discovery-workflow.html" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$UV_PYTHON_DIR:$UV_PYTHON_DIR" \
            -v "$GITHUB_WORKSPACE/notebooks:/workspace" \
            "$TEST_IMAGE" \
            pytest -m quantitative_signal_discovery_agent --disable-warnings --timeout=900 \
              --nat-binary "$GITHUB_WORKSPACE/.venv/bin/nat" \
              --qsd-config-optimization "$GITHUB_WORKSPACE/configs/config-optimization-no-telemetry.yml" \
              --html=/workspace/quantitative_signal_discovery_agent.html --self-contained-html
          test -s notebooks/quantitative_signal_discovery_agent.html

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            notebooks/signal-discovery-workflow.html
            notebooks/signal-discovery-workflow-executed.ipynb
            notebooks/quantitative_signal_discovery_agent.html
            src/signal_discovery_workflow/output/signal_*.json
          retention-days: 30

      - name: Set result output
        id: set_result
        if: always()
        run: echo "RESULT=$(if [ '${{ job.status }}' == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> "$GITHUB_OUTPUT"

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>

            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>

            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>

            <p>Thanks!</p>
