# Signal Discovery Workflow (no-telemetry): generate -> code -> evaluate -> feedback loop.
# Variant of config-optimization.yml with the Phoenix tracing exporter stripped, intended
# for cloud / Brev runs where there is no separate `phoenix serve` process to push traces to.

llms:
  signal_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.8
    max_tokens: 4000
    chat_template_kwargs:
      enable_thinking: false

  code_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.0
    max_tokens: 3000
    chat_template_kwargs:
      enable_thinking: false

  optimization_advisor:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.5
    max_tokens: 2000
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: signal_optimizer
  signal_generator_llm: signal_generator
  code_generator_llm: code_generator
  optimization_advisor_llm: optimization_advisor
  ic_threshold: 0.02
  p_value_threshold: 0.05
  max_iterations: 3
  num_signals: 2
  forward_periods: 5
  save_results: true
